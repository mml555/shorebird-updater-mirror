# cspell:words dorny
name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs: a newer push's result covers the older one.
  # Runs on main always finish so each commit has its own pass or fail,
  # which shows which commit broke main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      # The port branch runs CI on push, without needing a PR.
      - route-b
      - route-b-*

# Every job runs on the self-hosted ci-build runner, on trusted events only:
# the repository is public, so a pull request from a fork runs nothing here
# (each root job and the aggregate carry the guard below; the rest need
# `changes`). The macOS and Windows build legs and the iOS checks
# need GitHub-hosted runners (iOS needs the Apple SDK), which the account's
# Actions billing may not cover. They only exist when the repository variable
# HOSTED_RUNNERS is 'true'; otherwise they are skipped, not queued.
jobs:
  changes:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, x64, updater]

    permissions:
      contents: read
      pull-requests: read

    outputs:
      needs_flutter_build: ${{ steps.needs_flutter_build.outputs.changes }}
      needs_rust_build: ${{ steps.needs_rust_build.outputs.changes }}

    name: 👀 Detect Changes

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Build Detection
        id: needs_flutter_build
        with:
          filters: |
            shorebird_code_push:
              - ./.github/workflows/main.yaml
              - ./.github/actions/flutter_package/action.yaml
              - shorebird_code_push/**
              - Cargo.lock
              - rust-toolchain.toml
              # Integration tests under shorebird_code_push/test/integration
              # build and load the library_test_hooks cdylib, which
              # re-exports the production updater C API. A change to
              # either crate can break the suite, so trigger the
              # flutter package job on those paths too.
              - library/**
              - library_test_hooks/**

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Build Detection
        id: needs_rust_build
        with:
          filters: |
            library:
              - ./.github/workflows/main.yaml
              - ./.github/actions/rust_crate/action.yaml
              - Cargo.lock
              - Cargo.toml
              - rust-toolchain.toml
              - library/**
            patch:
              - ./.github/actions/rust_crate/action.yaml
              - Cargo.lock
              - Cargo.toml
              - rust-toolchain.toml
              - patch/**
            library_test_hooks:
              - ./.github/actions/rust_crate/action.yaml
              - Cargo.lock
              - Cargo.toml
              - rust-toolchain.toml
              - library/**
              - library_test_hooks/**
              # tests/fixture_corpus.rs replays the fixture corpus.
              - fixtures/**

  build_rust_crates:
    needs: changes
    if: ${{ needs.changes.outputs.needs_rust_build != '[]' }}

    strategy:
      # One OS failing (or a hosted leg not starting) must not cancel the
      # self-hosted Linux legs, whose result stands on its own.
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.needs_rust_build) }}
        # "linux" is the self-hosted runner; the hosted legs are gated.
        os: ${{ fromJSON(vars.HOSTED_RUNNERS == 'true' && '["macos-latest","windows-latest","linux"]' || '["linux"]') }}

    runs-on: ${{ matrix.os == 'linux' && fromJSON('["self-hosted","linux","x64","updater"]') || matrix.os }}

    name: 🦀 Build ${{ matrix.crate }} (${{ matrix.os }})

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦀 Build ${{ matrix.crate }}
        uses: ./.github/actions/rust_crate
        with:
          working_directory: ${{ matrix.crate }}

  # The host builds above never compile code behind cfg(target_os =
  # "android") or cfg(target_os = "ios"); the engine build is the first place
  # those paths compile. Lint them for the mobile targets here instead.
  check_android:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.needs_rust_build), 'library') }}

    runs-on: [self-hosted, linux, x64, updater]

    name: 📱 Check library (aarch64-linux-android)

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦀 Add aarch64-linux-android
        run: rustup target add aarch64-linux-android

      # ci-build has the engine's NDK (28.2.13676358, the one the shorebird
      # repo's e2e workflow pins) and the runner service sets ANDROID_NDK_HOME
      # to it; cargo-ndk points the C compiler that zstd-sys builds with at it.
      - name: 🤖 Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install --locked cargo-ndk@4.1.2

      - name: 🤖 Clippy (Android)
        working-directory: library
        run: cargo ndk --target aarch64-linux-android clippy -- -D warnings

  # Needs the Apple SDK (cc-rs runs xcrun for zstd-sys), so it only runs on
  # hosted macOS: gated on HOSTED_RUNNERS.
  check_ios:
    needs: changes
    if: ${{ vars.HOSTED_RUNNERS == 'true' && contains(fromJSON(needs.changes.outputs.needs_rust_build), 'library') }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          # The engine's arm64 iOS simulator build links this target
          # (shorebirdtech/flutter#225).
          - aarch64-apple-ios-sim

    runs-on: macos-latest

    name: 📱 Check library (${{ matrix.target }})

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦀 Add ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: 🍎 Clippy (iOS)
        working-directory: library
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings

  # Advisories, banned crates and sources for every crate in Cargo.lock
  # (config in deny.toml). Runs on every PR, not only Rust changes, so a
  # newly published advisory against a dependency we already ship fails CI.
  cargo_deny:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, x64, updater]

    name: 🛡️ cargo deny

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛡️ cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources

  build_flutter_packages:
    needs: changes
    if: ${{ needs.changes.outputs.needs_flutter_build != '[]' }}

    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.needs_flutter_build) }}

    runs-on: [self-hosted, linux, x64, updater]

    name: 🎯 Build ${{ matrix.package }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: 🐦 Build ${{ matrix.package }}
        uses: ./.github/actions/flutter_package
        with:
          coverage_excludes: "**/*.g.dart"
          working_directory: ${{ matrix.package }}

  ci:
    needs: [build_flutter_packages, build_rust_crates, cargo_deny, check_android, check_ios]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    runs-on: [self-hosted, linux, x64, updater]

    steps:
      # A cancelled job never ran its checks, so it fails the gate too.
      - name: ⛔️ exit(1) on failure
        if: ${{ contains(join(needs.*.result, ','), 'failure') || contains(join(needs.*.result, ','), 'cancelled') }}
        run: exit 1
