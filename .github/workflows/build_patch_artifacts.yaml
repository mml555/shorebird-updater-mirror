name: build_patch_artifacts

# Releases in this repo are immutable: once published, a release's assets
# can't be added or replaced. So pushing a patch-v* tag creates a draft
# release, every job uploads its binary to the draft, and the draft is
# published only after all uploads succeed.
#
# To release: git tag patch-vX.Y.Z && git push origin patch-vX.Y.Z
# If an upload fails, use "Re-run failed jobs"; the draft is reused.
# Don't publish a patch release from the UI: it would have no binaries,
# and an immutable release's tag can never be reused.

permissions:
  contents: write

on:
  push:
    tags:
      - "patch-v*"

jobs:
  create-draft:
    runs-on: [self-hosted, linux, x64, updater]
    name: 📝 Create Draft Release
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --verify-tag --title "patch ${TAG#patch-v}" --generate-notes

  upload-artifacts:
    needs: create-draft
    strategy:
      matrix:
        # "linux" is the self-hosted runner; the macOS and Windows legs need
        # hosted runners and only exist when HOSTED_RUNNERS is 'true'.
        include: ${{ fromJSON(vars.HOSTED_RUNNERS == 'true' && '[{"target":"x86_64-unknown-linux-musl","os":"linux"},{"target":"x86_64-apple-darwin","os":"macos-latest"},{"target":"aarch64-apple-darwin","os":"macos-latest"},{"os":"windows-latest"}]' || '[{"target":"x86_64-unknown-linux-musl","os":"linux"}]') }}

    runs-on: ${{ matrix.os == 'linux' && fromJSON('["self-hosted","linux","x64","updater"]') || matrix.os }}

    name: 🦀 Upload Artifacts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The musl target needs the rustup target and musl-gcc on ci-build, and
      # the upload action shells out to gh.
      - name: 🐧 Install musl and gh
        if: ${{ matrix.os == 'linux' }}
        run: |
          rustup target add "${{ matrix.target }}"
          for tool in musl-gcc gh; do
            command -v "$tool" >/dev/null && continue
            pkg=musl-tools; [ "$tool" = gh ] && pkg=gh
            sudo apt-get install -y --no-install-recommends "$pkg"
          done
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: "patch"
          target: ${{ matrix.target }}
          tar: none
          zip: all
          token: ${{ secrets.GITHUB_TOKEN }}

  # Gated on HOSTED_RUNNERS: a published release is immutable, so it must not
  # go out with only the Linux binary. Without the variable the draft is left
  # for a re-run (with the variable set) to fill and publish.
  publish:
    needs: upload-artifacts
    if: ${{ vars.HOSTED_RUNNERS == 'true' }}
    runs-on: [self-hosted, linux, x64, updater]
    name: 🚀 Publish Release
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Publishing can't be undone, so check every binary is there first.
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name | select(endswith(".zip"))] | length')
          if [ "$count" != 4 ]; then
            echo "Expected 4 zips on the draft, found $count" >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
